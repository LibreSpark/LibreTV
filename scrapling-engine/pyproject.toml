[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "libretv-scrapling-engine"
version = "0.1.0"
description = "Independent Scrapling service for LibreTV resource discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "scrapling[all]>=0.4.7,<0.5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "regex>=2024.11.6,<2027",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
libretv-scrapling-worker = "app.worker:main"
libretv-workflow-worker = "app.workflow_worker:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff==0.17.5",
  "pre-commit>=4,<5",
  "mypy>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]
extend-select = ["S113", "S310", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
