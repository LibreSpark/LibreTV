name: Feature request / 功能請求
description: "Suggest an idea for this project"
title: "[Feature Request]"
labels: ["enhancement"]
body:
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm / 確認
      description: Please confirm / 請你確認
      options:
        - label: I have searched the Issue and found no related feature requests / 我已經搜尋過Issue，沒有找到相關的功能請求
          required: true
  - type: textarea
    id: description
    attributes:
      label: Feature Description / 功能描述
      description: Describe the feature you want / 描述你想要的功能
    validations:
      required: true
  - type: textarea
    id: how_to
    attributes:
      label: How to Implement / 如何實現
      description: How to implement this feature / 應該如何實現這個功能
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Information / 附加資訊
      description: Any other information you think might be helpful to implement this feature / 你覺得對實現此功能有幫助的其它資訊
    validations:
      required: false