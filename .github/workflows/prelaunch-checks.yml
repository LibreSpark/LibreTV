name: prelaunch-checks

on:
  push:
    branches:
      - fix/prelaunch-security-voice-2026-11-03
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          PASSWORD: ci-test-password
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
