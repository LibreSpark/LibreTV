name: Authorized Live 4K Playback Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorized-live-4k-playback
  cancel-in-progress: false

jobs:
  live-4k-playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LIBRETV_4K_TEST_URL: ${{ secrets.LIBRETV_4K_TEST_URL }}
      LIBRETV_4K_ALLOWED_HOSTS: ${{ secrets.LIBRETV_4K_ALLOWED_HOSTS }}
      LIBRETV_4K_DURATION_SECONDS: ${{ vars.LIBRETV_4K_DURATION_SECONDS || '600' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: npm ci
      - name: Install isolated Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chrome with media codecs
        run: npx playwright install --with-deps chrome
      - name: Prepare 4K acceptance evidence directory
        run: mkdir -p acceptance-artifacts
      - name: Start loopback-only DNS-pinning egress proxy
        run: |
          set -euo pipefail
          (
            cd scrapling-engine
            EGRESS_PROXY_HOST=127.0.0.1 EGRESS_PROXY_PORT=8080 python -m app.egress_proxy
          ) > acceptance-artifacts/egress-proxy.log 2>&1 &
          echo $! > acceptance-artifacts/egress-proxy.pid
          for attempt in $(seq 1 50); do
            if python -c "import socket; s=socket.create_connection(('127.0.0.1', 8080), timeout=1); s.close()"; then
              exit 0
            fi
            sleep 0.2
          done
          cat acceptance-artifacts/egress-proxy.log
          echo 'DNS-pinning egress proxy failed to start' >&2
          exit 1
      - name: Verify sustained real 4K decode and playback
        run: |
          set -o pipefail
          node scripts/verify-live-4k-playback.mjs \
            2> acceptance-artifacts/4k-playback.stderr.log \
            | tee acceptance-artifacts/4k-playback.json
      - name: Stop loopback-only egress proxy
        if: always()
        run: |
          if [ -f acceptance-artifacts/egress-proxy.pid ]; then
            kill "$(cat acceptance-artifacts/egress-proxy.pid)" 2>/dev/null || true
          fi
      - name: Upload 4K playback acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorized-live-4k-playback-${{ github.run_id }}
          path: acceptance-artifacts/
          if-no-files-found: ignore
          retention-days: 14
