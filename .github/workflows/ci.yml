name: ci

# PR 与 main 推送都跑静态检查与单测。
#
# 为什么单独加这个：此前仓库里三个 workflow 全是 tag 或手动触发，唯一的 `npm test`
# 出现在 docker-publish 的镜像构建里——等于「发版才发现」。#960 第一版把
# `dns.promises.lookup` 按回调签名调用，导致受保护域内**所有出网请求挂到超时**，
# 而 549 条用例全绿（那些用例只断言 rejects.toThrow，挂死→超时同样抛错），
# 没有任何自动信号会拦住它合进 main。这一层就是补那个信号缺口。
#
# Node 版本跑 22 / 24 / 26 三条线，不再只跟 Dockerfile 的 node:22-alpine。
# 理由就是 issue #984：旧实现把依赖自带的 undici Agent 当 dispatcher 交给运行时内置 fetch，
# Node 22/24 恰好同代能跑，Node 26（内置 undici 已 7.x）在建连前就同步抛 fetch failed，
# 而固定在 22 上的 CI 与本地全绿——只有把版本拉开，这类运行时内部的漂移才有信号。
# （现在受保护请求已改由依赖自带的那份 undici 发出，与运行时版本解耦，矩阵是防复发。）

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ matrix.node-version }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
