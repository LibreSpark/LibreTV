name: docker-sync-hub

# 镜像标签对齐/补救工具：以**当前仓库** GHCR 包上某个版本 tag 的 digest 为源，
# 把「主.次」与 latest 标签在 GHCR 侧补齐，并在配置了 Docker Hub 凭据的仓库
# 同步到 docker.io/bestzwei/libretv，最后逐一校验一致。
# 不重新构建，纯 registry 元数据操作，几秒完成。
# 用途：
# - 主流程 merge 打标签不完整时的补救（如 v2.12.5/v2.12.6 只打上了版本号 tag）；
# - 两个 registry 标签不一致时的手动对齐。
# 注意：GHCR 源跟随触发仓库——在 bestZwei/LibreTV-Next 触发修
# ghcr.io/bestzwei/libretv-next，在 LibreSpark/LibreTV 触发修
# ghcr.io/librespark/libretv（并连带 Docker Hub）。两个仓库按需分别触发。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要对齐的版本号（如 2.12.6），将以该版本的 digest 为源补齐 主.次 与 latest'
        required: true
        default: ''

permissions:
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: docker.io/bestzwei/libretv

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Docker Hub 凭据仅在配置了的仓库（upstream）存在；fork 仓库跳过 DH 侧
      HAS_DOCKERHUB_CREDS: ${{ secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: docker/setup-buildx-action@v4

      # GHCR 源 = 当前仓库的包（GITHUB_REPOSITORY 统一转小写）
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        if: env.HAS_DOCKERHUB_CREDS == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 以版本 digest 为源补齐标签
        run: |
          ghcr_image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          version="${{ inputs.tag }}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式应为 主.次.修订（如 2.12.6），收到：${version}"
            exit 1
          fi
          minor="${version%.*}"
          digest=$(docker buildx imagetools inspect "${ghcr_image}:${version}" --format '{{.Manifest.Digest}}')
          if [ -z "$digest" ]; then
            echo "::error::GHCR 上不存在 ${ghcr_image}:${version}"
            exit 1
          fi
          echo "源：${ghcr_image}:${version} @ ${digest}"
          echo "GHCR：补齐 ${minor} latest"
          docker buildx imagetools create \
            -t "${ghcr_image}:${minor}" \
            -t "${ghcr_image}:latest" \
            "${ghcr_image}@${digest}"
          if [ "$HAS_DOCKERHUB_CREDS" = "true" ]; then
            echo "Docker Hub：补齐 ${version} ${minor} latest"
            docker buildx imagetools create \
              -t "${DOCKERHUB_IMAGE}:${version}" \
              -t "${DOCKERHUB_IMAGE}:${minor}" \
              -t "${DOCKERHUB_IMAGE}:latest" \
              "${ghcr_image}@${digest}"
          else
            echo "未配置 Docker Hub 凭据，跳过 DH 侧"
          fi

      - name: 校验全部标签 digest 一致
        run: |
          ghcr_image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          version="${{ inputs.tag }}"
          version="${version#v}"
          minor="${version%.*}"
          src=$(docker buildx imagetools inspect "${ghcr_image}:${version}" --format '{{.Manifest.Digest}}')
          fail=0
          check() {
            local image=$1 tag=$2
            local got
            got=$(docker buildx imagetools inspect "${image}:${tag}" --format '{{.Manifest.Digest}}')
            if [ "$got" = "$src" ]; then
              echo "OK  ${image}:${tag} @ ${got}"
            else
              echo "FAIL ${image}:${tag} @ ${got}（期望 ${src}）"
              fail=1
            fi
          }
          check "$ghcr_image" "$version"
          check "$ghcr_image" "$minor"
          check "$ghcr_image" latest
          if [ "$HAS_DOCKERHUB_CREDS" = "true" ]; then
            check "$DOCKERHUB_IMAGE" "$version"
            check "$DOCKERHUB_IMAGE" "$minor"
            check "$DOCKERHUB_IMAGE" latest
          fi
          exit $fail
