name: Deploy LibreTV Homepage Preview

on:
  workflow_dispatch:
    inputs:
      confirm_preview_deploy:
        description: "确认部署到独立的非公开预览 Worker（不会部署正式环境）"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: libretv-homepage-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: ${{ inputs.confirm_preview_deploy == 'yes' }}
    name: Build and deploy isolated preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/homepage-friday

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build HOME_V2 preview
        env:
          NEXT_PUBLIC_HOME_V2: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx opennextjs-cloudflare build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing preview environment secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing preview environment secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.preview.toml
