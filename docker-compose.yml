services:
  libretv:
    build: .
    # 版本管理：镜像 tag 与 package.json 的 version 保持一致
    # - 使用者：不设置 LIBRETV_IMAGE 即拉取 ghcr.io/librespark/libretv:latest（首次部署用 docker compose pull）
    # - 开发者：docker compose up -d --build 会在本地构建并打上同名 tag
    # - 需要固定版本时设置 LIBRETV_IMAGE=ghcr.io/librespark/libretv:<版本>
    image: ${LIBRETV_IMAGE:-ghcr.io/librespark/libretv:latest}
    container_name: libretv
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - collector_net
      - crawler-app
    # 无状态服务：观看历史在浏览器 IndexedDB、设置在 localStorage，无需挂载卷
    environment:
      # 必填：访问密码（在 .env 中设置，缺失时 compose 启动即报错提醒）
      - PASSWORD=${PASSWORD:?请在 .env 中设置 PASSWORD}
      # 可选：FMHY / Scrapling 采集服务（启用 collector profile 后使用）
      - SCRAPLING_API_BASE=${SCRAPLING_API_BASE:-http://scrapling-collector:8000}
      - SCRAPLING_API_TOKEN=${SCRAPLING_API_TOKEN:-}
      # 可选：会话/代理签名密钥（多实例部署建议显式设置：openssl rand -hex 32）
      # - PROXY_SECRET=your-secret
      # 可选：Cookie Secure 策略覆盖（true=强制开启 / false=强制关闭；不设置时按请求协议自动推导，HTTP 部署无需配置）
      # - COOKIE_SECURE=true
      # 可选：预置采集站（JSON 数组），用户端自动出现且默认勾选
      # - DEFAULT_SOURCES=[{"name":"示例源","url":"https://example.com/api.php/provide/vod"}]
      # 可选：预置直播源（M3U 订阅，JSON 数组），epg 为可选节目单地址
      # - DEFAULT_LIVE_SOURCES=[{"name":"示例直播源","url":"https://example.com/list.m3u","epg":"https://example.com/epg.xml.gz"}]
      # 可选：预置数据源订阅（SourceList JSON 链接，一次下发点播源 + 直播源）
      # refreshDays 为该订阅的静默刷新周期初始值（1-365 天，缺省 1 天），可省略；用户在面板改过后以面板为准
      # - DEFAULT_SUBSCRIPTIONS=["https://example.com/sources.json", {"url":"https://example.com/list.json","name":"名称","refreshDays":10}]
      # 可选：首页推荐数据源默认值（douban / bangumi / hot-list），仅对未主动选择过的用户生效
      # - DEFAULT_RECOMMEND_SOURCE=douban
      # 可选：自建内网 IPTV 放行（对拉列表、测活、拉流三个阶段同时生效，默认关闭以维持 SSRF 防护）
      # - LIVE_ALLOW_PRIVATE=1
      # 可选：代理上游请求超时（毫秒）与重试次数
      # - REQUEST_TIMEOUT=8000
      # - MAX_RETRIES=1
      # 可选：每个搜索源最多抓取的页数（1-50，默认 5），调大会显著增加上游请求量
      # - SEARCH_MAX_PAGES=5
      # 可选：单个搜索源的总死线（毫秒，3s-60s，默认 10000），到点中断该源并标记超时
      # - SEARCH_SOURCE_TIMEOUT_MS=10000
      # 可选：代理请求 UA（豆瓣防盗链等场景）
      # - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36
      # 可选：影视榜单推荐源（60s API）实例地址，官方公共实例有限流
      # - 60S_API_BASE=https://60s.crystelf.top
      - SCRAPLING_ENGINE_URL=${SCRAPLING_ENGINE_URL:-http://scrapling-engine:8787}
      - SCRAPLING_ENGINE_API_KEY=${SCRAPLING_API_KEY:-}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}


  # Optional isolated Python runtime for FMHY discovery + Scrapling crawling.
  # Start explicitly with: docker compose --profile collector up -d --build
  scrapling-collector:
    profiles: ["collector"]
    build:
      context: ./services/scrapling-collector
    container_name: libretv-scrapling-collector
    restart: unless-stopped
    networks:
      collector_net:
        ipv4_address: ${SCRAPLING_COLLECTOR_IP:-172.30.60.10}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    shm_size: 256m
    cap_drop:
      - ALL
    cap_add:
      # Entrypoint needs CHOWN for the mounted volume and SETGID/SETUID for gosu.
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    environment:
      - SCRAPLING_API_TOKEN=${SCRAPLING_API_TOKEN:-}
      # Keep every outbound collector operation disabled until the host firewall has been installed and verified.
      - SCRAPLING_EGRESS_FIREWALL_CONFIRMED=${SCRAPLING_EGRESS_FIREWALL_CONFIRMED:-0}
      - SCRAPLING_DB_PATH=${SCRAPLING_DB_PATH:-/data/collector.sqlite3}
      - SEEDHUB_PURGE_LEGACY_CATALOG=${SEEDHUB_PURGE_LEGACY_CATALOG:-1}
      - PORT=8000
    expose:
      - "8000"
    volumes:
      - scrapling_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scrapling-worker:
    profiles: ["collector"]
    build:
      context: ./services/scrapling-collector
    container_name: libretv-scrapling-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    networks:
      collector_net:
        ipv4_address: ${SCRAPLING_WORKER_IP:-172.30.60.11}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    shm_size: 256m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    environment:
      - SCRAPLING_API_TOKEN=${SCRAPLING_API_TOKEN:-}
      - SCRAPLING_EGRESS_FIREWALL_CONFIRMED=${SCRAPLING_EGRESS_FIREWALL_CONFIRMED:-0}
      - SCRAPLING_DB_PATH=${SCRAPLING_DB_PATH:-/data/collector.sqlite3}
      - SEEDHUB_PURGE_LEGACY_CATALOG=${SEEDHUB_PURGE_LEGACY_CATALOG:-1}
    volumes:
      - scrapling_data:/data
    depends_on:
      scrapling-collector:
        condition: service_healthy

  scrapling-postgres:
    profiles: ["crawler"]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: libretv_scrapling
      POSTGRES_USER: libretv_scrapling
      POSTGRES_PASSWORD: ${SCRAPLING_DB_PASSWORD:-local-dev-only-change-me}
    volumes:
      - scrapling-postgres-data:/var/lib/postgresql/data
    networks:
      - crawler-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libretv_scrapling -d libretv_scrapling"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 1.0

  scrapling-engine:
    profiles: ["crawler"]
    build:
      context: ./scrapling-engine
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      SCRAPLING_API_KEY: ${SCRAPLING_API_KEY:-}
      DATABASE_URL: postgresql://libretv_scrapling:${SCRAPLING_DB_PASSWORD:-local-dev-only-change-me}@scrapling-postgres:5432/libretv_scrapling
      CRAWL_DATA_DIR: /data
      SUPERVISOR_API_BASE: ${SUPERVISOR_API_BASE:-https://api.openai.com/v1}
      SUPERVISOR_API_KEY: ${SUPERVISOR_API_KEY:-}
      SUPERVISOR_MODEL: ${SUPERVISOR_MODEL:-}
      SUPERVISOR_TIMEOUT_SECONDS: ${SUPERVISOR_TIMEOUT_SECONDS:-45}
      SCRAPLING_EGRESS_PROXY: http://scrapling-egress-proxy:8080
      SCRAPLING_REQUIRE_EGRESS_PROXY: "true"
    networks:
      - crawler-app
      - crawler-clients
      - crawler-db
    volumes:
      - scrapling-crawl-data:/data
    depends_on:
      scrapling-postgres:
        condition: service_healthy
      scrapling-egress-proxy:
        condition: service_healthy
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8787), timeout=2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  scrapling-job-worker:
    profiles: ["crawler"]
    build:
      context: ./scrapling-engine
    command: ["libretv-scrapling-worker", "--worker-id", "crawl-worker-1"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    environment:
      SCRAPLING_API_KEY: ${SCRAPLING_API_KEY:-}
      DATABASE_URL: postgresql://libretv_scrapling:${SCRAPLING_DB_PASSWORD:-local-dev-only-change-me}@scrapling-postgres:5432/libretv_scrapling
      CRAWL_DATA_DIR: /data
      SCRAPLING_EGRESS_PROXY: http://scrapling-egress-proxy:8080
      SCRAPLING_REQUIRE_EGRESS_PROXY: "true"
    networks:
      - crawler-clients
      - crawler-db
    volumes:
      - scrapling-crawl-data:/data
    depends_on:
      scrapling-postgres:
        condition: service_healthy
      scrapling-egress-proxy:
        condition: service_healthy
      scrapling-engine:
        condition: service_healthy

  scrapling-workflow-worker:
    profiles: ["crawler"]
    build:
      context: ./scrapling-engine
    command: ["libretv-workflow-worker"]
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    environment:
      SCRAPLING_API_KEY: ${SCRAPLING_API_KEY:-}
      DATABASE_URL: postgresql://libretv_scrapling:${SCRAPLING_DB_PASSWORD:-local-dev-only-change-me}@scrapling-postgres:5432/libretv_scrapling
      CRAWL_DATA_DIR: /data
      MEDIA_PROBE_ROOT: /probe/staging
      MEDIA_PROBE_STAGING: /probe/staging
      MEDIA_PROBE_INBOX: /probe/inbox
      MEDIA_PROBE_OUTBOX: /probe/outbox
      SUPERVISOR_API_BASE: ${SUPERVISOR_API_BASE:-https://api.openai.com/v1}
      SUPERVISOR_API_KEY: ${SUPERVISOR_API_KEY:-}
      SUPERVISOR_MODEL: ${SUPERVISOR_MODEL:-}
      SUPERVISOR_TIMEOUT_SECONDS: ${SUPERVISOR_TIMEOUT_SECONDS:-45}
      SCRAPLING_EGRESS_PROXY: http://scrapling-egress-proxy:8080
      SCRAPLING_REQUIRE_EGRESS_PROXY: "true"
    networks:
      - crawler-clients
      - crawler-db
    volumes:
      - scrapling-crawl-data:/data
      - scrapling-probe-staging:/probe/staging
      - scrapling-probe-inbox:/probe/inbox
      - scrapling-probe-outbox:/probe/outbox:ro
    depends_on:
      scrapling-postgres:
        condition: service_healthy
      scrapling-egress-proxy:
        condition: service_healthy
      scrapling-engine:
        condition: service_healthy
      scrapling-media-probe:
        condition: service_healthy

  scrapling-egress-proxy:
    profiles: ["crawler"]
    build:
      context: ./scrapling-engine
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    environment:
      EGRESS_PROXY_HOST: 0.0.0.0
      EGRESS_PROXY_PORT: 8080
    networks:
      - crawler-clients
      - crawler-egress
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(1); raise SystemExit(s.connect_ex(('127.0.0.1',8080)) != 0)"]
      interval: 10s
      timeout: 3s
      retries: 5

  scrapling-media-probe:
    profiles: ["crawler"]
    build:
      context: ./scrapling-engine
      dockerfile: Dockerfile.probe
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp:./scrapling-engine/seccomp-ffprobe.json
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      MEDIA_PROBE_ROOT: /probe/staging
      MEDIA_PROBE_STAGING: /probe/staging
      MEDIA_PROBE_INBOX: /probe/inbox
      MEDIA_PROBE_OUTBOX: /probe/outbox
    volumes:
      - scrapling-probe-staging:/probe/staging:ro
      - scrapling-probe-inbox:/probe/inbox:ro
      - scrapling-probe-outbox:/probe/outbox
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if Path('/probe/staging').is_dir() and Path('/probe/inbox').is_dir() and Path('/probe/outbox').is_dir() else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  scrapling_data:
  scrapling-postgres-data:
  scrapling-crawl-data:
  scrapling-probe-staging:
  scrapling-probe-inbox:
  scrapling-probe-outbox:

networks:
  collector_net:
    name: libretv_scrapling_net
    driver: bridge
    ipam:
      config:
        - subnet: ${SCRAPLING_NETWORK_SUBNET:-172.30.60.0/24}
  crawler-app:
    internal: true
  crawler-clients:
    internal: true
  crawler-db:
    internal: true
  crawler-egress:
    driver: bridge
