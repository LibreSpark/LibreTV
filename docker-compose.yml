services:
  libretv:
    build: .
    # 版本管理：镜像 tag 与 package.json 的 version 保持一致
    # - 使用者：不设置 LIBRETV_IMAGE 即拉取 ghcr.io/librespark/libretv:latest（首次部署用 docker compose pull）
    # - 开发者：docker compose up -d --build 会在本地构建并打上同名 tag
    # - 需要固定版本时设置 LIBRETV_IMAGE=ghcr.io/librespark/libretv:<版本>
    image: ${LIBRETV_IMAGE:-ghcr.io/librespark/libretv:latest}
    container_name: libretv
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 无状态服务：观看历史在浏览器 IndexedDB、设置在 localStorage，无需挂载卷
    environment:
      # 必填：访问密码（在 .env 中设置，缺失时 compose 启动即报错提醒）
      - PASSWORD=${PASSWORD:?请在 .env 中设置 PASSWORD}
      # 可选：会话/代理签名密钥（多实例部署建议显式设置：openssl rand -hex 32）
      # - PROXY_SECRET=your-secret
      # 可选：Cookie Secure 策略覆盖（true=强制开启 / false=强制关闭；不设置时按请求协议自动推导，HTTP 部署无需配置）
      # - COOKIE_SECURE=true
      # 可选：预置采集站（JSON 数组），用户端自动出现且默认勾选
      - 'DEFAULT_SOURCES=[{"name":"1080zyk","url":"https://api.yzzy-api.com/inc/apijson.php"},{"name":"红牛资源","url":"https://www.hongniuzy2.com/api.php/provide/vod"},{"name":"新浪资源","url":"https://api.xinlangapi.com/xinlangapi.php/provide/vod"},{"name":"极速资源","url":"https://jszyapi.com/api.php/provide/vod"},{"name":"西瓜资源","url":"https://caiji.xgzyapi.com/api.php/provide/vod"},{"name":"魔都资源","url":"https://www.mdzyapi.com/api.php/provide/vod"},{"name":"暴风资源","url":"https://bfzyapi.com/api.php/provide/vod"},{"name":"ikun资源","url":"https://www.ikunzyapi.com/api.php/provide/vod"},{"name":"豪华资源","url":"https://hhzyapi.com/api.php/provide/vod"},{"name":"iqiyi资源","url":"https://iqiyizyapi.com/api.php/provide/vod"},{"name":"电影天堂资源","url":"https://caiji.dyttzyapi.com/api.php/provide/vod"},{"name":"无尽资源","url":"https://api.wujinapi.com/api.php/provide/vod"},{"name":"金鹰资源","url":"https://jinyingzy.com/api.php/provide/vod"},{"name":"U酷资源","url":"https://api.ukuapi88.com/api.php/provide/vod"},{"name":"速播资源","url":"https://subocaiji.com/api.php/provide/vod"},{"name":"猫眼资源","url":"https://api.maoyanapi.top/api.php/provide/vod"},{"name":"非凡资源","url":"https://api.ffzyapi.com/api.php/provide/vod"},{"name":"最大资源","url":"https://api.zuidapi.com/api.php/provide/vod"},{"name":"360资源","url":"https://360zyzz.com/api.php/provide/vod"},{"name":"量子资源","url":"https://cj.lziapi.com/api.php/provide/vod"},{"name":"如意资源","url":"https://cj.rycjapi.com/api.php/provide/vod"}]'
      # 可选：预置直播源（M3U 订阅，JSON 数组），epg 为可选节目单地址
      # - DEFAULT_LIVE_SOURCES=[{"name":"示例直播源","url":"https://example.com/list.m3u","epg":"https://example.com/epg.xml.gz"}]
      # 可选：预置数据源订阅（SourceList JSON 链接，一次下发点播源 + 直播源）
      # refreshDays 为该订阅的静默刷新周期初始值（1-365 天，缺省 1 天），可省略；用户在面板改过后以面板为准
      # - DEFAULT_SUBSCRIPTIONS=["https://example.com/sources.json", {"url":"https://example.com/list.json","name":"名称","refreshDays":10}]
      # 可选：首页推荐数据源默认值（douban / bangumi / hot-list），仅对未主动选择过的用户生效
      # - DEFAULT_RECOMMEND_SOURCE=douban
      # 可选：自建内网 IPTV 放行（对拉列表、测活、拉流三个阶段同时生效，默认关闭以维持 SSRF 防护）
      # - LIVE_ALLOW_PRIVATE=1
      # 可选：代理上游请求超时（毫秒）与重试次数
      # - REQUEST_TIMEOUT=8000
      # - MAX_RETRIES=1
      # 可选：每个搜索源最多抓取的页数（1-50，默认 5），调大会显著增加上游请求量
      # - SEARCH_MAX_PAGES=5
      # 可选：单个搜索源的总死线（毫秒，3s-60s，默认 10000），到点中断该源并标记超时
      # - SEARCH_SOURCE_TIMEOUT_MS=10000
      # 可选：代理请求 UA（豆瓣防盗链等场景）
      # - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36
      # 可选：影视榜单推荐源（60s API）实例地址，官方公共实例有限流
      # - 60S_API_BASE=https://60s.crystelf.top
